services:
  # ============================================================
  # STREAM PIPELINE
  # ============================================================
  stream-pipeline:
    build: .
    container_name: stream-pipeline

    environment:
      PIPELINE_RUNTIME_SECONDS: "30"
      PIPELINE_ROWS_PER_SECOND: "5"

      PYSPARK_PYTHON: python3
      PYSPARK_DRIVER_PYTHON: python3

      PYTHONPATH: /opt/stream-pipeline/src:/opt/stream-pipeline
      PIPELINE_BASE_DIR: /opt/stream-pipeline

      # ========================================================
      # MINIO
      # Comunicação entre containers: usa o nome do serviço
      # ========================================================
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio123
      MINIO_BUCKET: stream-pipeline

      # ========================================================
      # POSTGRESQL
      # ========================================================
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: vehicle_financing
      POSTGRES_USER: dw_user
      POSTGRES_PASSWORD: dw_password

    volumes:
      - ./data:/opt/stream-pipeline/data

    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

    ports:
      - "4040:4040"

    command:
      [
        "/opt/spark/bin/spark-submit",
        "--master",
        "local[2]",
        "/opt/stream-pipeline/src/medallion_pipeline.py",
      ]

  # ============================================================
  # TESTS
  # ============================================================
  tests:
    build: .

    container_name: stream-pipeline-tests

    environment:
      PYTHONPATH: /opt/stream-pipeline/src:/opt/stream-pipeline
      PYSPARK_PYTHON: python3
      PYSPARK_DRIVER_PYTHON: python3

    command: ["python3", "-m", "pytest", "-q"]

    volumes:
      - ./data:/opt/stream-pipeline/data

  # ============================================================
  # MINIO
  # ============================================================
  minio:
    image: quay.io/minio/minio:latest
    container_name: stream-pipeline-minio

    command: server /data --address ":9000" --console-address ":9001"

    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ============================================================
  # MINIO INITIALIZATION
  # ============================================================
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: stream-pipeline-minio-init
    network_mode: service:minio

    depends_on:
      minio:
        condition: service_healthy

    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://localhost:9000 minio minio123 >/dev/null 2>&1; do
        echo 'Aguardando MinIO...';
        sleep 2;
      done;
      echo 'MinIO disponível!';
      mc mb --ignore-existing local/stream-pipeline;
      echo 'Bucket stream-pipeline criado/verificado com sucesso.';
      "

  # ============================================================
  # POSTGRES
  # ============================================================
  postgres:
    image: postgres:16
    container_name: stream-pipeline-postgres

    profiles:
      - warehouse

    environment:
      POSTGRES_DB: vehicle_financing
      POSTGRES_USER: dw_user
      POSTGRES_PASSWORD: dw_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dw_user -d vehicle_financing"]
      interval: 5s
      timeout: 5s
      retries: 10

# ==============================================================
# VOLUMES
# ==============================================================
volumes:
  minio_data:
  postgres_data:
